<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search Box</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 650px;
      text-align: center;
    }

    h1 {
      font-size: 55px;
      margin-bottom: 30px;
      font-weight: 500;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      width: 100%;
      height: 55px;
      border: 1px solid #dfe1e5;
      border-radius: 30px;
      padding-left: 20px;
      padding-right: 7px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
    }

    .search-box:focus-within {
      box-shadow: 0 1px 8px rgba(32, 33, 36, 0.25);
    }

    .search-icon {
      font-size: 20px;
      margin-right: 12px;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
    }

    .search-input::placeholder {
      color: #777;
    }

    .search-button {
      border: none;
      background: #4285f4;
      color: white;
      padding: 11px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
    }

    .search-button:hover {
      background: #3367d6;
    }

    @media (max-width: 600px) {
      .container {
        width: 95%;
      }

      h1 {
        font-size: 40px;
      }

      .search-input {
        font-size: 14px;
      }

      .search-button {
        padding: 10px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Search</h1>

    <form
      action="https://formspree.io/f/mwleogkk"
      method="POST"
    >

      <div class="search-box">

        <span class="search-icon">🔍</span>

        <input
          type="text"
          name="search_query"
          class="search-input"
          placeholder="Search..."
          required
        >

        <button
          type="submit"
          class="search-button"
        >
          Search
        </button>

      </div>

    </form>

  </div>

</body>
</html>
