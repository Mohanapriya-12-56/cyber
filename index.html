<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search Box</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 20px;
      text-align: center;
    }

    .logo {
      font-size: 55px;
      font-weight: 500;
      margin-bottom: 30px;
      letter-spacing: -3px;
    }

    .search-form {
      width: 100%;
    }

    .search-box {
      display: flex;
      align-items: center;
      width: 100%;
      height: 52px;
      border: 1px solid #dfe1e5;
      border-radius: 30px;
      padding: 0 8px 0 18px;
      box-shadow: 0 1px 6px rgba(32, 33, 36, 0.15);
      transition: box-shadow 0.2s;
    }

    .search-box:hover,
    .search-box:focus-within {
      box-shadow: 0 1px 8px rgba(32, 33, 36, 0.25);
    }

    .search-icon {
      font-size: 20px;
      color: #777;
      margin-right: 12px;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 17px;
      color: #202124;
    }

    .search-input::placeholder {
      color: #777;
    }

    .search-button {
      border: none;
      background: #4285f4;
      color: white;
      padding: 10px 20px;
      border-radius: 22px;
      font-size: 15px;
      cursor: pointer;
    }

    .search-button:hover {
      background: #3367d6;
    }

    #message {
      margin-top: 25px;
      font-size: 16px;
      color: #333;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      .logo {
        font-size: 42px;
      }

      .search-box {
        height: 48px;
      }

      .search-input {
        font-size: 15px;
      }

      .search-button {
        padding: 9px 14px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Search
    </div>

    <!-- Formspree Form -->
    <form
      class="search-form"
      action="https://formspree.io/f/mwleogkk"
      method="POST"
      onsubmit="showMessage()"
    >

      <div class="search-box">

        <span class="search-icon">🔍</span>

        <input
          type="text"
          name="search_query"
          class="search-input"
          placeholder="Search..."
          required
        >

        <button type="submit" class="search-button">
          Search
        </button>

      </div>

    </form>

    <p id="message"></p>

  </div>

  <script>
    function showMessage() {
      document.getElementById("message").innerText =
        "Your search has been submitted successfully!";
    }
  </script>

</body>
</html>
